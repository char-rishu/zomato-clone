<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header class="navbar">

        <div class="logo">
            zomato
        </div>

        <div class="search-box">

            <input type="text" placeholder="Search for restaurant or food">

        </div>

        <button class="login-btn">
            Log in
        </button>

        <button class="signup-btn">
            Sign up
        </button>
        <button class="cart-btn" onclick="goToCart()">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>

    </header>


    <main class="checkout-page">

        <h1>
            Checkout
        </h1>


        <!-- Delivery Address -->

        <div class="checkout-box">

            <h2>
                Delivery Address
            </h2>

            <input type="text" id="customerName" placeholder="Your Name">

            <input type="text" id="customerAddress" placeholder="Enter your address">

            <input type="text" id="customerPhone" placeholder="Phone Number">

        </div>


        <!-- Order Summary -->

        <div class="checkout-box">

            <h2>
                Order Summary
            </h2>

            <div id="checkoutItems"></div>

            <hr>

            <h3>
                Total: ₹<span id="checkoutTotal">0</span>
            </h3>

        </div>


        <!-- Place Order -->

        <button class="place-order-btn" onclick="placeOrder()">
            Place Order
        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
