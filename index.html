<!DOCTYPE html>
<html lang="en">

<head>

    <title>ZOMATO - Order food online</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <video autoplay muted loop playsinline class="bg-video">
            <source src="bgm.mp4" type="video/mp4">
        </video>

        <div class="overlay"></div>

        <main>
            <img src="zomato.png" alt="Zomato Logo">
            <h1>
                India’s #1

                <br>
                food delivery app
            </h1>
            <div>
                Experience fast &amp; easy online ordering
                on the Zomato app
            </div>

            <div>
                <a href="https://link.zomato.com/xqzv/iwz6g6kg" target="_blank"
                    class="z-50 size-fit transition-transform duration-200 hover:scale-110">
                    <div class=""><img alt="App Download Logo" class="h-12 object-contain md:h-[48px] xl:h-[56px] 2xl:h-[64px]
                            " src="https://b.zmtcdn.com/data/o2_assets/aad864bd17860b27634fe621001c32db1739350431.png"
                            loading="lazy"></div>
                </a>

                <a href="https://link.zomato.com/xqzv/xigpfha6" target="_blank"
                    class="z-50 size-fit transition-transform duration-200 hover:scale-110">
                    <div class=""><img alt="App Download Logo"
                            class="h-12 object-contain md:h-[48px] xl:h-[56px] 2xl:h-[64px]"
                            src="https://b.zmtcdn.com/data/o2_assets/df6464de32f4a09262cee301f65aaa661739351256.png"
                            loading="lazy"></div>
                </a>
            </div>

        </main>

    </header>



</body>

</html>
