<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">zomato</div>

        <div class="search-box">
            <input type="text" placeholder="Search for restaurant or food">
        </div>

        <button class="login-btn">Log in</button>
        <button class="signup-btn">Sign up</button>
        <button class="cart-btn" onclick="goToCart()">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>

    </header>


    <main class="restaurant-page">

        <div class="restaurant-banner">

            <img src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=1200&q=80"
                alt="Restaurant">

        </div>


        <div class="restaurant-header">

            <div>

                <h1 id="restaurantName">
                    Pizza Palace
                </h1>

                <p id="restaurantCuisine">
                    Pizza, Italian, Fast Food
                </p>

                <p id="restaurantLocation">
                    Delhi • 2.5 km away
                </p>

            </div>


            <div class="big-rating" id="restaurantRating">
                ★ 4.5
            </div>

        </div>


        <div class="restaurant-info-box">

            <div>
                <strong id="restaurantPrice">
                    ₹250
                </strong>

                <span>
                    for one
                </span>
            </div>


            <div>
                <strong id="deliveryTime">
                    25 min
                </strong>

                <span>
                    delivery
                </span>
            </div>


            <div>
                <strong>
                    ₹200
                </strong>

                <span>
                    minimum order
                </span>
            </div>

        </div>


        <section class="menu-section">

            <h2>Popular Items</h2>

            <div id="menuContainer"></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
